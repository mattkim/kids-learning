<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Learning</title><style>body{font:18px system-ui;background:#f3f7ff;color:#25334f;max-width:850px;margin:auto;padding:20px}header,.card{background:white;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 3px 15px #22335518}h1{color:#3657af}button,input{font:inherit;padding:12px;border-radius:10px;border:1px solid #aabbdd;margin:5px;cursor:pointer}button{background:#e3eaff;color:#243b83}button:hover{background:#cedaff}.big{font-size:3rem;font-weight:bold}.hidden{display:none}.good{color:green}.bad{color:#a33}#speechControls,#options,#navigation{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#speechControls{padding:12px 0;margin:12px 0;border-bottom:1px solid #dce4f3}#options{padding:12px 0;min-height:60px}#navigation{padding-top:16px;margin-top:12px;border-top:1px solid #dce4f3}#speechControls button{background:#e7f6f5;color:#17635c}#navigation button{background:#dce6ff}#navigation #next{background:#3557b7;color:white}small{color:#526079}#drawer{background:white;padding:12px;border-radius:12px}#drawer button{display:block;width:95%;text-align:left}.lesson-group{margin:20px 0;padding:12px;background:#f7faff;border-radius:12px}.picture{font-size:5rem;text-align:center}#prompt{white-space:pre-line}</style><header><button aria-label="Toggle menu" onclick="toggleNav()">☰ Menu</button><h1>🌟 Kids Learning</h1><p>Reading, math, and early learning</p><nav id="drawer" class="hidden"><button onclick="showSection('reading')">1st Grade · DIBELS Reading</button><button onclick="showSection('math')">1st Grade · MAP Math</button><button onclick="showSection('preschool')">Preschool · Alphabet</button></nav></header><main><section id="home" class="card"><h2 id="sectionTitle">1st Grade · DIBELS Reading</h2><p id="sectionIntro">Original home exercises, not official assessments.</p><div id="menu"></div><h2>Practice history</h2><div id="history"></div><button onclick="if(confirm('Clear local history?')){localStorage.removeItem('learningHistory');history()}">Clear history</button></section><section id="game" class="card hidden"><h2 id="heading"></h2><small id="count"></small><p id="prompt"></p><div id="picture" class="picture"></div><div id="speechControls" aria-label="Audio controls"></div><div id="options" aria-label="Answer choices"></div><p id="feedback" aria-live="polite"></p><div id="navigation" aria-label="Navigation"><button onclick="home()">← Activities</button><button id="next" class="hidden" onclick="advance()">Next →</button></div></section></main><small>Home practice, not a standardized assessment. No accounts, analytics, or external services. History stays in this browser.</small><script>
const $=id=>document.getElementById(id);
const pair=pairs=>pairs.map(([a,b])=>({prompt:'Choose the word with the long vowel sound.',choices:[a,b],answer:b}));
const pick=(s,a)=>s.split(' ').map(w=>({prompt:w,choices:a,answer:w}));
const oral=s=>s.split(' ').map(w=>({prompt:w,oral:true}));
const data=[
{name:'Letter naming',items:oral('P U W y u q U N O v L o n h i t S o Z f Q x B n c u K N y G f p z H C J d g I X B M w a t m A W')},
{name:'p and q',items:pick('p q p p q q p q p q q p q q p p q p q p',['p','q'])},
{name:'b and d',items:pick('d b d b b d b d d b d b',['b','d'])},
{name:'Long and short vowels',items:pair([['cap','cape'],['mad','made'],['tap','tape'],['plan','plane'],['pin','pine'],['rid','ride'],['kit','kite'],['fin','fine'],['hop','hope'],['not','note'],['rod','rode'],['cod','code'],['cub','cube'],['tub','tube'],['cut','cute'],['us','use']])},
{name:'Missing p or q',items:[['__en','p'],['__ig','p'],['__uit','q'],['__uick','q'],['__ot','p']].map(([prompt,answer])=>({prompt,answer,choices:['p','q']}))},
{name:'Nonsense-word decoding',items:oral('lat mip vop sud teg fim nup zab kef pim dax wug sog lep tav jot bim feg rup niz pob vek dut yim gaz')},
{name:'Real-word reading',items:oral('cat sit map hop red sun fish shop thin chat stop flag milk nest hand jump frog this that with went from said they have were what when your there make bike home cube time rain play boat feet team light night turn bird corn park green train sleep brush bring smile after under happy little because again could would')},
{name:'Sound counting',items:[['map',3],['ship',3],['frog',4],['sun',3],['clap',4],['fish',3],['stop',4],['rain',3],['nest',4],['thin',3],['chop',3],['flag',4],['wish',3],['drum',4],['cake',3],['brush',4],['plant',5],['sleep',4],['crash',4],['smile',4]].map(([word,n])=>({prompt:'How many sounds do you hear?',spoken:word,choices:['2','3','4','5'],answer:String(n)}))},
{name:'Spelling',items:'ship stop frog make cube train light jumping rabbit sunset'.split(' ').map(word=>({prompt:'Type the word you hear.',spoken:word,answer:word,typed:true}))},
{name:'Reading comprehension',items:[{prompt:'Our class had a little turtle named Dot. Dot liked to rest on a warm rock. Sam helped clean the tank and filled a cup with fresh water. What animal was Dot?',choices:['A turtle','A bird','A rabbit'],answer:'A turtle'},{prompt:'Ella planned a picnic at the park. Rain tapped on the window, so the family ate on a blanket in the living room. Why did the picnic move indoors?',choices:['It rained','It snowed','It was dark'],answer:'It rained'},{prompt:'Nora put on her boots because the grass was wet. Why did she wear boots?',choices:['The grass was wet','She was tired','She was swimming'],answer:'The grass was wet'}]},
{name:'PSF · Say each sound',items:[['map','/m/ /ă/ /p/'],['ship','/sh/ /ĭ/ /p/'],['frog','/f/ /r/ /ŏ/ /g/'],['sun','/s/ /ŭ/ /n/'],['clap','/k/ /l/ /ă/ /p/'],['fish','/f/ /ĭ/ /sh/'],['stop','/s/ /t/ /ŏ/ /p/'],['rain','/r/ /ā/ /n/'],['nest','/n/ /ĕ/ /s/ /t/'],['thin','/th/ /ĭ/ /n/'],['chop','/ch/ /ŏ/ /p/'],['flag','/f/ /l/ /ă/ /g/'],['wish','/w/ /ĭ/ /sh/'],['drum','/d/ /r/ /ŭ/ /m/'],['cake','/k/ /ā/ /k/'],['brush','/b/ /r/ /ŭ/ /sh/'],['plant','/p/ /l/ /ă/ /n/ /t/'],['sleep','/s/ /l/ /ē/ /p/'],['crash','/k/ /r/ /ă/ /sh/'],['smile','/s/ /m/ /ī/ /l/']].map(([word,sounds])=>({prompt:'Say every sound in: '+word,spoken:word,oral:true,hint:'Parent guide: '+sounds}))},
{name:'ORF · Passage reading',items:[
{prompt:'The sun was up when Max got out of bed. He put on his red hat and ran to the yard. A small bird sat on the fence. Max stood still so the bird would not fly away. Then the bird sang a sweet song. Max smiled and went inside to tell his dad.',oral:true,hint:'Parent: listen for accurate words, smooth reading, and self-corrections. Mark correct when the passage is read with few errors.'},
{prompt:'Mia had a little seed. She dug a hole in the soft dirt and put the seed inside. Each day, she gave it some water. At first, she saw nothing. Then a tiny green leaf came up. Mia was glad. She knew her plant would need sun, water, and time to grow.',oral:true,hint:'Parent: note words missed and whether reading is smooth. This is untimed practice, not an official ORF score.'},
{prompt:'On Saturday, Ben and his sister went to the lake. They saw ducks swim across the water. One duck came close to the shore. Ben did not feed it because the sign said to let wild birds find their own food. They sat on a bench and watched the ducks until it was time to go.',oral:true,hint:'Parent: listen for accuracy, pace, and expression. Encourage a second reading for fluency.'}
]},
{name:'NWF · Blend the whole word',items:oral('vab sim ket nog fep lut mip dag vot zup pel rin thab shom chig blen frup stog plim drat')},
{name:'WRF · High-frequency words',items:oral('the of to and a in is you that it he was for on are as with his they I at be this have from or one had by word but not what all were we when your can said there use an each which she do how their if will up other about out many then them these so some her would make like him into time has look two more write go see number no way could people my than first water been called who am its now find long down day did get come made may part')},

{name:'MAP · Add and subtract',items:Array.from({length:30},(_,i)=>{let a=6+i,b=i%9+1,plus=i%2===0,n=plus?a+b:a-b;return {prompt:a+(plus?' + ':' − ')+b+' = ?',answer:String(n),choices:[n,n+1,n-1,n+2].map(String)}})},
{name:'MAP · Place value and number sense',items:[...[[34,3,4],[67,6,7],[90,9,0],[52,5,2],[18,1,8],[105,10,5]].map(([n,t,o])=>({prompt:'What number has '+t+' tens and '+o+' ones?',answer:String(n),choices:[n,n+1,n+10,n-10].map(String)})),...[[28,30],[49,51],[71,73],[98,100]].map(([a,c])=>({prompt:'What number is between '+a+' and '+c+'?',answer:String(a+1),choices:[a,a+1,c,c+1].map(String)}))]},
{name:'MAP · Word problems',items:[['8 red apples and 6 green apples. How many apples?',14],['17 crayons, 5 used. How many left?',12],['9 birds, then 7 more. How many birds?',16],['20 books, 8 given away. How many left?',12],['2 bags with 5 marbles each. How many marbles?',10],['15 stickers, 6 given away. How many left?',9],['A toy costs 12 cents. You pay 20 cents. What is the change?',8],['4 tables have 2 chairs each. How many chairs?',8],['13 riders, 4 get off and 3 get on. How many riders?',12],['6 pages Monday and 9 Tuesday. How many pages?',15]].map(([prompt,n])=>({prompt,answer:String(n),choices:[n-2,n-1,n,n+1].map(String)}))},
{name:'MAP · Shapes and measurement',items:[['How many sides does a triangle have?','3',['2','3','4','5']],['How many corners does a rectangle have?','4',['3','4','5','6']],['Which shape has no straight sides?','Circle',['Square','Circle','Triangle','Rectangle']],['Which is longer?','1 foot',['1 foot','1 inch']],['How many inches in a foot?','12',['10','11','12','20']],['Which solid has 6 square faces?','Cube',['Cube','Sphere','Cone','Cylinder']],['Which tool measures length?','Ruler',['Clock','Ruler','Thermometer']],['What is half of 10?','5',['4','5','6','10']]].map(([prompt,answer,choices])=>({prompt,answer,choices}))},
{name:'MAP · Time, money, and data',items:[['Minutes in one hour?','60',['30','45','60','100']],['Cents in a dime?','10',['1','5','10','25']],['Cents in a nickel?','5',['1','5','10','25']],['Value of 2 dimes in cents?','20',['10','15','20','25']],['A chart has 4 cats, 7 dogs, 3 fish. Which has most?','Dogs',['Cats','Dogs','Fish']],['5 sunny days and 2 rainy days. How many days?','7',['5','6','7','8']],['Days in one week?','7',['5','6','7','10']],['3 pennies and 1 nickel. How many cents?','8',['6','7','8','9']]].map(([prompt,answer,choices])=>({prompt,answer,choices}))},
{name:'Preschool · Alphabet with pictures',items:[['A','apple','🍎'],['B','bat','🦇'],['C','cat','🐱'],['D','dog','🐶'],['E','egg','🥚'],['F','fan','🪭'],['G','gum','🫧'],['H','hat','🎩'],['I','ink','🖋️'],['J','jam','🫙'],['K','kid','🧒'],['L','log','🪵'],['M','map','🗺️'],['N','net','🥅'],['O','ox','🐂'],['P','pig','🐷'],['Q','quilt','🧵'],['R','rat','🐀'],['S','sun','☀️'],['T','top','🪀'],['U','up','⬆️'],['V','van','🚐'],['W','web','🕸️'],['X','fox','🦊'],['Y','yak','🐂'],['Z','zip','🤐']].map(([letter,word,picture])=>({prompt:letter+' / '+letter.toLowerCase()+' — '+word,picture,spoken:letter+' is for '+word,answer:letter,choices:[letter,String.fromCharCode(65+(letter.charCodeAt(0)-64)%26),String.fromCharCode(65+(letter.charCodeAt(0)-63)%26)]}))},
{name:'Preschool · Beginning sounds',items:[['cat','C','🐱'],['dog','D','🐶'],['sun','S','☀️'],['pig','P','🐷'],['hat','H','🎩'],['bat','B','🦇'],['fan','F','🪭'],['map','M','🗺️'],['net','N','🥅'],['rat','R','🐀'],['van','V','🚐'],['yak','Y','🐂'],['web','W','🕸️'],['egg','E','🥚'],['log','L','🪵']].map(([word,answer,picture])=>({prompt:'What letter starts '+word+'?',spoken:word,picture,answer,choices:[answer,String.fromCharCode(65+(answer.charCodeAt(0)-64)%26),String.fromCharCode(65+(answer.charCodeAt(0)-63)%26)]}))}

];
let activity,i,correct,done;
const groups=[['DIBELS-related skills',[[0,'LNF · Letter naming'],[10,'PSF · Segment sounds'],[7,'Sound counting'],[5,'NWF · Nonsense words'],[12,'NWF · Blend words'],[6,'WRF · Real words'],[13,'WRF · High-frequency words'],[11,'ORF · Passage reading']]],['Phonics and decoding support',[[1,'Letter recognition'],[2,'Letter recognition'],[3,'Vowel patterns'],[4,'Letter patterns'],[8,'Spelling']]],['Reading comprehension support',[[9,'Passages and questions']]]];const mathGroups=[['Operations and word problems',[[14,'Addition and subtraction'],[16,'Story problems']]],['Number sense',[[15,'Place value']]],['Measurement, geometry, and data',[[17,'Shapes and measurement'],[18,'Time, money, and data']]]];const preschoolGroups=[['Alphabet foundations',[[19,'Letters A to Z'],[20,'Beginning sounds']]]];let currentSection='reading';function toggleNav(){$('drawer').classList.toggle('hidden')}function showSection(id){currentSection=id;$('drawer').classList.add('hidden');home();drawMenu()}function drawMenu(){const title={reading:'1st Grade · DIBELS Reading',math:'1st Grade · Winter MAP Math',preschool:'Preschool · Alphabet'};const intro={reading:'Original home practice for DIBELS-related reading skills. Oral exercises need an adult to score accuracy.',math:'Original first-grade winter MAP-style math practice. Not official MAP questions or score predictions; MAP is adaptive.',preschool:'Letter names, simple words, and picture symbols. X is represented by fox for the ending sound.'};$('sectionTitle').textContent=title[currentSection];$('sectionIntro').textContent=intro[currentSection];$('menu').replaceChildren();const selected=currentSection==='reading'?groups:currentSection==='math'?mathGroups:preschoolGroups;selected.forEach(([heading,entries])=>{let box=document.createElement('section');box.className='lesson-group';let h=document.createElement('h3');h.textContent=heading;box.append(h);entries.forEach(([n,tag])=>{let a=data[n],b=document.createElement('button');b.textContent=a.name+' ('+a.items.length+') — '+tag;b.onclick=()=>start(n);box.append(b)});$('menu').append(box)})}drawMenu();
function history(){let h=JSON.parse(localStorage.getItem('learningHistory')||'[]');$('history').textContent=h.length?h.slice(-8).reverse().map(x=>x.name+': '+x.correct+'/'+x.total+' · '+x.date).join(' | '):'No sessions yet.'}
function home(){$('game').classList.add('hidden');$('home').classList.remove('hidden');history()}
function start(n){activity=data[n];i=correct=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');render()}
let speechRate=0.85;function say(word){if(!('speechSynthesis' in window)){alert('Speech playback is not available in this browser.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=speechRate;speechSynthesis.speak(u)}
function button(label,fn,group='options'){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$(group).append(b)}
function render(){done=false;let x=activity.items[i];$('heading').textContent=activity.name;$('count').textContent=(i+1)+' / '+activity.items.length;$('prompt').textContent=x.prompt;$('picture').textContent=x.picture||'';$('prompt').className=x.prompt.length<30?'big':'';$('options').replaceChildren();$('speechControls').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');button('🔊 Read instructions',()=>say(activity.name+'. '+(x.oral?'Read this aloud. Ask a helper to mark your answer.':x.typed?'Listen and spell the word.':x.spoken?'Listen and choose your answer.':'Choose the correct answer.')),'speechControls');button('🔊 Read text',()=>say(x.spoken||x.prompt),'speechControls');button('🐢 Slower',()=>{speechRate=0.65;say(x.spoken||x.prompt)},'speechControls');button('⏹ Stop',()=>{if('speechSynthesis' in window)speechSynthesis.cancel()},'speechControls');if(x.hint){let guide=document.createElement('p');guide.textContent=x.hint;guide.style.fontSize='.9rem';guide.style.color='#526079';$('options').append(guide)}if(x.oral){button('✓ Correct',()=>grade(true));button('Try again / incorrect',()=>grade(false))}else if(x.typed){let inp=document.createElement('input');inp.setAttribute('aria-label','Your spelling');$('options').append(inp);button('Check',()=>grade(inp.value.trim().toLowerCase()===x.answer));inp.onkeydown=e=>{if(e.key==='Enter')grade(inp.value.trim().toLowerCase()===x.answer)}}else x.choices.forEach(c=>button(c,()=>grade(c===x.answer)))}
function grade(ok){if(done)return;done=true;if(ok)correct++;let x=activity.items[i];$('feedback').textContent=ok?'✓ Great work!':'Keep practicing!'+(x.oral?'':' Correct answer: '+x.answer);$('feedback').className=ok?'good':'bad';$('options').querySelectorAll('button,input').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=i===activity.items.length-1?'Finish':'Next →'}
function advance(){i++;if(i<activity.items.length)return render();let h=JSON.parse(localStorage.getItem('learningHistory')||'[]');h.push({name:activity.name,correct,total:activity.items.length,date:new Date().toLocaleDateString()});localStorage.setItem('learningHistory',JSON.stringify(h.slice(-100)));$('picture').textContent='';$('prompt').textContent='Finished! '+correct+' / '+activity.items.length+' correct.';$('options').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');$('count').textContent='Complete'}
history();
</script></html>
