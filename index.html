['High-frequency irregular words','the, a, of, to, do|said, says, was, were|one, once, two|you, your, they, their|could, would, should|have, give, some, come|what, who, where|does, done, gone|friend, again, because|people, many, any'],
['Compare these','rain / ran / train|stay / say / play|loud / cloud / out|cow / snow|food / good|team / bread|bird / turn / her|cap / cape|pin / pine|hop / hope|cub / cube|thin / this']]]];


function luckyGrade(){return currentSection==='lucky-preschool'?'preschool':'first'}
function drawLuckyButton(){let area=$('luckyArea');area.replaceChildren();if(currentSection!=='lucky-first'&&currentSection!=='lucky-preschool')return;let b=document.createElement('button');b.className='lucky';b.textContent='🎲 I’m Feeling Lucky — Random '+(luckyGrade()==='first'?'1st Grade':'Preschool')+' Practice';b.onclick=()=>randomPractice(luckyGrade());area.append(b)}
function randomPractice(grade){let pool=[];let ids=grade==='first'?Array.from({length:19},(_,i)=>i):[19,20,21];ids.forEach(n=>{let a=data[n];if(a&&a.items)a.items.forEach(x=>pool.push({kind:'question',title:a.name,item:x}))});if(grade==='first'){reviews.forEach(([title,sections])=>sections.forEach(([name,words])=>words.split('|').forEach(word=>pool.push({kind:'review',title:title+' · '+name,word}))))}else{const letters=[['A','apple','🍎'],['B','bat','🦇'],['C','cat','🐱'],['D','dog','🐶'],['E','egg','🥚'],['F','fan','🪭'],['G','gum','🫧'],['H','hat','🎩'],['I','ink','🖋️'],['J','jam','🫙'],['K','kid','🧒'],['L','log','🪵'],['M','map','🗺️'],['N','net','🥅'],['O','ox','🐂'],['P','pig','🐷'],['Q','quilt','🧵'],['R','rat','🐀'],['S','sun','☀️'],['T','top','🪀'],['U','up','⬆️'],['V','van','🚐'],['W','web','🕸️'],['X','fox','🦊'],['Y','yak','🐂'],['Z','zip','🤐']];letters.forEach(([letter,word,picture])=>pool.push({kind:'review',title:'Alphabet picture review',word:letter+' / '+letter.toLowerCase()+' — '+word,picture}));for(let n=1;n<=10;n++)pool.push({kind:'review',title:'Counting to 10 · Picture review',word:n+' — '+['','one','two','three','four','five','six','seven','eight','nine','ten'][n]+' apples. Count the pictures!',picture:Array(n).fill('🍎').join(' ')})}
if(!pool.length)return;let pick=pool[Math.floor(Math.random()*pool.length)];let area=$('luckyArea');area.querySelectorAll('.lucky-panel').forEach(x=>x.remove());let panel=document.createElement('section');panel.className='lucky-panel';let title=document.createElement('h3');title.textContent='🎲 Your random practice';panel.append(title);let source=document.createElement('div');source.className='lucky-source';source.textContent=pick.title+(pick.kind==='review'?' · Review card':' · Question');panel.append(source);let body=document.createElement('div');body.className='lucky-content';body.textContent=pick.kind==='review'?pick.word:pick.item.prompt;panel.append(body);if(pick.picture||pick.item&&pick.item.picture){let picture=document.createElement('div');picture.className='picture';picture.textContent=pick.picture||pick.item.picture;panel.append(picture)}
let controls=document.createElement('div');let listen=document.createElement('button');listen.textContent='🔊 Listen';listen.onclick=()=>say(pick.kind==='review'?pick.word:(pick.item.spoken||pick.item.prompt));controls.append(listen);
if(pick.kind==='question'){let x=pick.item;if(x.choices){let options=document.createElement('div');x.choices.forEach(choice=>{let b=document.createElement('button');b.textContent=choice;b.onclick=()=>{feedback.textContent=choice===x.answer?'✓ Correct!':'Try again. Correct answer: '+x.answer;options.querySelectorAll('button').forEach(btn=>btn.disabled=true)};options.append(b)});panel.append(options)}else if(x.typed){let input=document.createElement('input');input.setAttribute('aria-label','Your answer');panel.append(input);let check=document.createElement('button');check.textContent='Check';check.onclick=()=>{feedback.textContent=input.value.trim().toLowerCase()===x.answer?'✓ Correct!':'Correct answer: '+x.answer};controls.append(check)}else{let reveal=document.createElement('button');reveal.textContent='Show adult guidance';reveal.onclick=()=>{feedback.textContent=x.hint||'Read aloud. An adult can check accuracy.'};controls.append(reveal)}}else{let check=document.createElement('label');let box=document.createElement('input');box.type='checkbox';check.append(box,document.createTextNode('Practiced'));controls.append(check)}
let feedback=document.createElement('p');feedback.setAttribute('aria-live','polite');panel.append(controls,feedback);area.append(panel)}

function drawPreschoolReview(){
const words=[['A','apple','🍎','a short a'],['B','bat','🦇','b'],['C','cat','🐱','hard c'],['D','dog','🐶','d'],['E','egg','🥚','short e'],['F','fan','🪭','f'],['G','gum','🫧','hard g'],['H','hat','🎩','h'],['I','ink','🖋️','short i'],['J','jam','🫙','j'],['K','kid','🧒','k'],['L','log','🪵','l'],['M','map','🗺️','m'],['N','net','🥅','n'],['O','ox','🐂','short o'],['P','pig','🐷','p'],['Q','quilt','🧵','qu says kw'],['R','rat','🐀','r'],['S','sun','☀️','s'],['T','top','🪀','t'],['U','up','⬆️','short u'],['V','van','🚐','v'],['W','web','🕸️','w'],['X','fox','🦊','x says ks at the end'],['Y','yak','🐂','y'],['Z','zip','🤐','z']];
let section=document.createElement('section');section.className='lesson-group';let heading=document.createElement('h3');heading.textContent='A–Z picture review';section.append(heading);let note=document.createElement('p');note.textContent='Explore each letter, say its name, and practice the example word. X uses the ending sound in fox; Q uses quilt. Tap Reviewed when ready.';section.append(note);
let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px';
words.forEach(([letter,word,picture,sound])=>{let card=document.createElement('article');card.style.cssText='background:white;border:1px solid #dce4f3;border-radius:14px;padding:14px;text-align:center';let title=document.createElement('div');title.style.cssText='font-size:2.1rem;font-weight:700';title.textContent=letter+' '+letter.toLowerCase();card.append(title);let pic=document.createElement('div');pic.style.cssText='font-size:4rem;margin:6px 0';pic.textContent=picture;pic.setAttribute('role','img');pic.setAttribute('aria-label',word);card.append(pic);let label=document.createElement('div');label.style.cssText='font-size:1.25rem;font-weight:600';label.textContent=word;card.append(label);let tip=document.createElement('small');tip.textContent=sound;card.append(tip);let controls=document.createElement('div');let listen=document.createElement('button');listen.textContent='🔊 Hear';listen.onclick=()=>say(letter+' is for '+word+'. '+word+'.');controls.append(listen);card.append(controls);let checkLabel=document.createElement('label');let check=document.createElement('input');check.type='checkbox';let key='preschool-review-'+letter;check.checked=localStorage.getItem(key)==='1';check.onchange=()=>localStorage.setItem(key,check.checked?'1':'0');checkLabel.append(check,document.createTextNode('Reviewed'));card.append(checkLabel);grid.append(card)});section.append(grid);$('menu').append(section);
let counting=document.createElement('section');counting.className='lesson-group';let countTitle=document.createElement('h3');countTitle.textContent='🔢 Counting to 10 · Picture review';counting.append(countTitle);let countNote=document.createElement('p');countNote.textContent='Count each picture aloud, then tap Hear. Mark each number Reviewed when you are ready.';counting.append(countNote);let countGrid=document.createElement('div');countGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px';for(let n=1;n<=10;n++){let card=document.createElement('article');card.style.cssText='background:white;border:1px solid #dce4f3;border-radius:14px;padding:14px;text-align:center';let number=document.createElement('div');number.style.cssText='font-size:2rem;font-weight:700';number.textContent=n;let pictures=document.createElement('div');pictures.style.cssText='font-size:2rem;line-height:1.5;overflow-wrap:anywhere';pictures.textContent=Array(n).fill('🍎').join(' ');pictures.setAttribute('aria-label',n+' apples');let word=document.createElement('div');word.textContent=['','one','two','three','four','five','six','seven','eight','nine','ten'][n];word.style.cssText='font-size:1.2rem;font-weight:600';let hear=document.createElement('button');hear.textContent='🔊 Hear';hear.onclick=()=>say(n+' apples. Count: '+Array.from({length:n},(_,i)=>i+1).join(', '));let label=document.createElement('label');let check=document.createElement('input');check.type='checkbox';let key='preschool-count-review-'+n;check.checked=localStorage.getItem(key)==='1';check.onchange=()=>localStorage.setItem(key,check.checked?'1':'0');label.append(check,document.createTextNode('Reviewed'));card.append(number,pictures,word,hear,label);countGrid.append(card)}counting.append(countGrid);$('menu').append(counting)}

function drawReviews(){reviews.forEach(([title,sections],i)=>{let card=document.createElement('section');card.className='lesson-group';let h=document.createElement('h3');h.textContent=title;card.append(h);sections.forEach(([name,words],j)=>{let d=document.createElement('details');d.open=i<4;let summary=document.createElement('summary');summary.textContent=name;summary.style.cssText='font-weight:bold;cursor:pointer;padding:10px';d.append(summary);let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px';words.split('|').forEach((word,k)=>{let item=document.createElement('div');item.style.cssText='background:white;padding:10px;border-radius:9px;border:1px solid #dde5f5';let p=document.createElement('div');p.textContent=word;item.append(p);let label=document.createElement('label');label.style.fontSize='.85rem';let cb=document.createElement('input');cb.type='checkbox';let key='review-'+i+'-'+j+'-'+k;cb.checked=localStorage.getItem(key)==='1';cb.onchange=()=>localStorage.setItem(key,cb.checked?'1':'0');label.append(cb,document.createTextNode('Reviewed'));item.append(label);let audio=document.createElement('button');audio.textContent='🔊';audio.setAttribute('aria-label','Read '+word);audio.onclick=()=>say(word);item.append(audio);grid.append(item)});d.append(grid);card.append(d)});$('menu').append(card)})}

function history(){let h=JSON.parse(localStorage.getItem('learningHistory')||'[]');$('history').textContent=h.length?h.slice(-8).reverse().map(x=>x.name+': '+x.correct+'/'+x.total+' · '+x.date).join(' | '):'No sessions yet.'}
function home(){$('game').classList.add('hidden');$('home').classList.remove('hidden');history()}
function start(n){activity=data[n];i=correct=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');render()}
let speechRate=0.85;function say(word){if(!('speechSynthesis' in window)){alert('Speech playback is not available in this browser.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=speechRate;speechSynthesis.speak(u)}
function button(label,fn,group='options'){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$(group).append(b)}
function render(){done=false;let x=activity.items[i];$('heading').textContent=activity.name;$('count').textContent=(i+1)+' / '+activity.items.length;$('prompt').textContent=x.prompt;$('picture').textContent=x.picture||'';$('prompt').className=x.prompt.length<30?'big':'';$('options').replaceChildren();$('speechControls').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');button('🔊 Read instructions',()=>say(activity.name+'. '+(x.oral?'Read this aloud. Ask a helper to mark your answer.':x.typed?'Listen and spell the word.':x.spoken?'Listen and choose your answer.':'Choose the correct answer.')),'speechControls');button('🔊 Read text',()=>say(x.spoken||x.prompt),'speechControls');button('🐢 Slower',()=>{speechRate=0.65;say(x.spoken||x.prompt)},'speechControls');button('⏹ Stop',()=>{if('speechSynthesis' in window)speechSynthesis.cancel()},'speechControls');if(x.hint){let guide=document.createElement('p');guide.textContent=x.hint;guide.style.fontSize='.9rem';guide.style.color='#526079';$('options').append(guide)}if(x.oral){button('✓ Correct',()=>grade(true));button('Try again / incorrect',()=>grade(false))}else if(x.typed){let inp=document.createElement('input');inp.setAttribute('aria-label','Your spelling');$('options').append(inp);button('Check',()=>grade(inp.value.trim().toLowerCase()===x.answer));inp.onkeydown=e=>{if(e.key==='Enter')grade(inp.value.trim().toLowerCase()===x.answer)}}else x.choices.forEach(c=>button(c,()=>grade(c===x.answer)))}
function grade(ok){if(done)return;done=true;if(ok)correct++;let x=activity.items[i];$('feedback').textContent=ok?'✓ Great work!':'Keep practicing!'+(x.oral?'':' Correct answer: '+x.answer);$('feedback').className=ok?'good':'bad';$('options').querySelectorAll('button,input').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=i===activity.items.length-1?'Finish':'Next →'}
function advance(){i++;if(i<activity.items.length)return render();let h=JSON.parse(localStorage.getItem('learningHistory')||'[]');h.push({name:activity.name,correct,total:activity.items.length,date:new Date().toLocaleDateString()});localStorage.setItem('learningHistory',JSON.stringify(h.slice(-100)));$('picture').textContent='';$('prompt').textContent='Finished! '+correct+' / '+activity.items.length+' correct.';$('options').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');$('count').textContent='Complete'}
history();
</script></html>
