<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Quest · Math Adventures</title>
<style>body{margin:0;background:#dcecff;color:#24304b;font:16px system-ui;text-align:center}header{padding:12px;background:#2876bb}a{color:#ffffff}h1{margin:4px;font-size:25px}.wrap{max-width:960px;margin:auto;padding:12px}canvas{display:block;width:100%;max-width:896px;aspect-ratio: 16/10;image-rendering:pixelated;border:6px solid #27324b;box-shadow:7px 7px 0 #27324b;border-radius:9px;background:#6eaa69;touch-action:none}button{background:#ffda69;color:#25304b;border:3px solid #25304b;box-shadow:3px 3px 0 #25304b;border-radius:8px;font:bold 18px system-ui;padding:11px 18px;margin:4px;cursor:pointer}#hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}#question{background:#fff3cc;color:#25304b;border:5px solid #25304b;border-radius:12px;padding:15px;max-width:410px;margin:10px auto}#question[hidden]{display:none}#question strong{font-size:30px}#controls{display:flex;justify-content:space-between;align-items:center;margin:10px 0}#controls button{min-width:55px}#message{min-height:25px}small{color:#d2dfd0}</style>
<header><a href="../index.html">← Kids Learning</a><h1>🌲 Block Quest: Math Adventures</h1></header><div class="wrap"><div id="hud"><span id="inventory">🪵 Wood: 0 · 🪨 Stone: 0</span><span id="quest">Quest: Collect 3 wood and 3 stone</span></div><canvas id="world" width="896" height="560" aria-label="Top-down forest adventure game"></canvas><div id="message" role="status">Explore with arrow keys or WASD. Stand next to trees and rocks, then press Space.</div><div id="question" hidden><div id="task"></div><strong id="problem"></strong><div id="answers"></div></div><div id="controls"><div><div><button data-dir="up">▲</button></div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button id="interact">⛏️ Gather / Build</button></div><small>Original pixel artwork drawn in code · First-grade addition and subtraction · Progress saves on this device</small></div>
<script>
const c=document.getElementById('world'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const T=32,W=28,H=17;let player={x:4,y:9},wood=0,stone=0,bridge=false,active=null,problem=null;
const saved=JSON.parse(localStorage.getItem('blockQuestSave')||'null');
const objects=[{x:6,y:5,t:'tree'},{x:9,y:10,t:'tree'},{x:3,y:13,t:'tree'},{x:12,y:4,t:'tree'},{x:11,y:12,t:'rock'},{x:7,y:13,t:'rock'},{x:15,y:6,t:'rock'},{x:18,y:12,t:'rock'},{x:23,y:4,t:'tree'},{x:24,y:12,t:'rock'}];
if(saved){wood=saved.wood||0;stone=saved.stone||0;bridge=!!saved.bridge;player=saved.player||player;for(const o of objects)if((saved.gathered||[]).includes(o.x+','+o.y))o.gone=true;}
function save(){localStorage.setItem('blockQuestSave',JSON.stringify({wood,stone,bridge,player,gathered:objects.filter(o=>o.gone).map(o=>o.x+','+o.y)}))}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function tile(x,y){let px=x*T,py=y*T,n=(x*17+y*31)%13;rect(px,py,T,T,['#78ba59','#7fbe5b','#84c363','#7db95b'][n%4]);for(let i=0;i<5;i++){let xx=(x*11+y*7+i*13)%29,yy=(x*3+y*17+i*9)%29;rect(px+xx,py+yy,2+(i%2),2,i%2?'#6eac52':'#98cc72')}if(n===5||n===9){rect(px+21,py+16,3,3,'#f7f1bd');rect(px+18,py+19,3,3,n===5?'#ffb7d1':'#f4cf64');rect(px+24,py+19,3,3,'#fff1a8')}if(n===2){rect(px+6,py+23,2,5,'#4f9b4d');rect(px+10,py+21,2,7,'#4f9b4d')}}
function tree(x,y){let a=x*T,b=y*T;rect(a+11,b+17,12,16,'#583b32');rect(a+13,b+19,3,12,'#ad7044');rect(a+2,b+13,30,15,'#225d40');rect(a+4,b+5,26,21,'#276c44');rect(a+8,b+1,20,19,'#348a50');rect(a+12,b-4,13,12,'#3f9955');rect(a+3,b+12,9,8,'#3e9854');rect(a+7,b+6,7,5,'#65b763');rect(a+15,b+1,9,4,'#71c46c');rect(a+21,b+11,7,5,'#4caa60');rect(a+4,b+23,7,3,'#174b37');rect(a+21,b+23,8,3,'#174b37')}
function rock(x,y){let a=x*T,b=y*T;rect(a+3,b+16,26,12,'#465866');rect(a+6,b+10,23,16,'#697d89');rect(a+11,b+6,14,18,'#9eafb1');rect(a+8,b+11,9,5,'#c6ccc2');rect(a+19,b+12,5,7,'#829ba5');rect(a+5,b+23,10,3,'#394b5a');rect(a+22,b+23,6,3,'#455460');rect(a+13,b+8,4,3,'#e0d6bc')}
function draw(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){tile(x,y);if(x===20||x===21){rect(x*T,y*T,T,T,'#4a9cbd');rect(x*T+((y*7)%23),y*T+8,12,3,'#8dd9dd')}if(x>1&&x<20&&y===8)rect(x*T,y*T,T,9,'#c7a46b')}
for(let y=0;y<H;y++)if(y%3===0){rect(19*T,y*T,3,19,'#e2d5a3')}
if(bridge){for(let x=20;x<=21;x++){rect(x*T,8*T,T,T,'#9c7045');rect(x*T,8*T+4,T,4,'#d7a875');rect(x*T,8*T+23,T,4,'#d7a875')}}
rect(2*T,2*T,96,75,'#e3b578');rect(2*T,2*T+66,96,9,'#a8764e');rect(2*T-8,2*T-12,112,24,'#7b3e47');for(let i=0;i<7;i++)rect(2*T-5+i*16,2*T-8,13,5,'#b85b55');rect(3*T+8,3*T+9,21,34,'#61402b');rect(3*T+12,3*T+12,4,4,'#a57b55');rect(4*T+12,3*T,17,17,'#f7d77d');rect(4*T+12,3*T,17,3,'#754c3a');rect(4*T+19,3*T,3,17,'#754c3a');
for(const o of objects)if(!o.gone)(o.t==='tree'?tree:rock)(o.x,o.y);
let a=player.x*T,b=player.y*T;rect(a+8,b+7,18,12,'#a45c3f');rect(a+10,b+9,14,12,'#f3c99b');rect(a+5,b+3,24,5,'#a87842');rect(a+10,b-2,14,8,'#e4b968');rect(a+9,b+19,17,10,'#437fb0');rect(a+9,b+27,7,5,'#493d46');rect(a+21,b+27,7,5,'#493d46');rect(a+20,b+13,3,3,'#332c31');rect(a+12,b+21,4,7,'#e2a54e');
if(!bridge){rect(19*T,7*T+4,3*T,22,'#704f3d');rect(19*T+7,7*T+8,78,14,'#d5b17b');ctx.fillStyle='#382d25';ctx.font='bold 13px monospace';ctx.fillText('BRIDGE',19*T+13,7*T+19)}
ctx.fillStyle='#fff5d8';ctx.font='bold 17px monospace';ctx.fillText('🌿 FOREST MEADOW',15,25)}
function update(){document.getElementById('inventory').textContent='🪵 Wood: '+wood+' · 🪨 Stone: '+stone;document.getElementById('quest').textContent=bridge?'🎉 Bridge repaired! Explore the far bank':wood>=3&&stone>=3?'Quest: Go to the bridge and build!':'Quest: Collect 3 wood and 3 stone';draw()}
function message(s){document.getElementById('message').textContent=s}
function blocked(x,y){if(x<0||y<0||x>=W||y>=H)return true;if((x===20||x===21)&&!(bridge&&y===8))return true;return objects.some(o=>!o.gone&&o.x===x&&o.y===y)}
function move(dx,dy){if(problem)return;let x=player.x+dx,y=player.y+dy;if(!blocked(x,y)){player={x,y};save();update()}else message('That way is blocked. Try another path!')}
function nearby(o){return Math.abs(o.x-player.x)+Math.abs(o.y-player.y)<=1}
function interact(){if(problem)return;const o=objects.find(o=>!o.gone&&nearby(o));if(o){active=o;ask(o.t==='tree'?'Chop the tree':'Mine the rock');return}if(!bridge&&player.y>=6&&player.y<=10&&player.x>=18&&player.x<=19){if(wood>=3&&stone>=3){wood-=3;stone-=3;bridge=true;message('🎉 You built the bridge! Great work!');save();update()}else message('The bridge needs 3 wood and 3 stone. Keep exploring!');return}message('Move next to a tree, rock, or the bridge first.')}
function ask(label){let a=2+Math.floor(Math.random()*10),b=1+Math.floor(Math.random()*9),plus=Math.random()>.35;let correct=plus?a+b:a-b;if(!plus&&correct<0){let z=a;a=b;b=z;correct=a-b}problem={correct};document.getElementById('task').textContent=label+'! Solve to collect a resource.';document.getElementById('problem').textContent=a+(plus?' + ':' − ')+b+' = ?';let options=[correct,correct+1,correct-1].sort(()=>Math.random()-.5);document.getElementById('answers').replaceChildren();for(const n of options){let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>answer(n);document.getElementById('answers').append(btn)}document.getElementById('question').hidden=false}
function answer(n){if(n!==problem.correct){message('Not quite! Try another answer.');return}if(active.t==='tree')wood++;else stone++;active.gone=true;active=null;problem=null;document.getElementById('question').hidden=true;message('⭐ Correct! Resource collected.');save();update()}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();move(...dirs[k])}if(e.code==='Space'){e.preventDefault();interact()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...dirs[b.dataset.dir])});document.getElementById('interact').onclick=interact;update();
</script>
