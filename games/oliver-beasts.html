<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oliver's Question Beasts</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"><style>
:root{--ink:#1a1c2c;--panel:#262b44;--navy:#333c87;--blue:#3b5dc9;--cyan:#73eff7;--white:#f4f4f4;--gold:#ffcd75;--red:#b13e53;--green:#38b764;--lime:#a7f070;--grey:#94b0c2}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--white);font:27px/1.15 'VT323',monospace}button{cursor:pointer;font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--gold)}.app{max-width:820px;margin:auto;padding:12px 12px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.tag,.tiny{font:10px/1.7 'Press Start 2P',monospace;color:var(--grey)}.chip{background:var(--panel);border:3px solid var(--white);padding:9px;color:var(--gold);font:12px 'Press Start 2P',monospace;box-shadow:0 4px #000}h1{font:clamp(23px,5vw,42px)/1.45 'Press Start 2P',monospace;color:var(--gold);text-shadow:4px 4px var(--red),7px 7px #000;text-align:center;margin:15px 0}.subtitle{text-align:center;color:var(--cyan);margin:0 0 20px}.panel{background:var(--panel);border:4px solid var(--white);padding:16px;box-shadow:0 5px #000;margin:12px 0}.hero{display:flex;align-items:center;gap:18px}.hero canvas{width:112px;height:112px;image-rendering:pixelated;background:var(--ink);flex:none}.hero strong{font:16px/1.5 'Press Start 2P',monospace;color:var(--gold)}.action{border:3px solid var(--white);background:var(--navy);padding:14px 16px;box-shadow:0 4px #000}.action:active{transform:translateY(3px);box-shadow:0 1px #000}.action:hover{background:var(--blue)}.primary{background:var(--green);color:var(--ink);font:15px/1.5 'Press Start 2P',monospace;width:100%;margin:12px 0}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stagebtn{text-align:left;min-height:90px}.stagebtn strong{display:block;color:var(--gold);font:12px/1.5 'Press Start 2P',monospace}.stagebtn:disabled{opacity:.4;cursor:not-allowed}.battle{position:relative;aspect-ratio:16/9;border:4px solid #000;overflow:hidden;background:#333c87}.battle canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hp{position:absolute;top:7px;width:40%;background:#000b;border:2px solid white;padding:5px;font:10px/1.5 'Press Start 2P',monospace}.hp.left{left:7px}.hp.right{right:7px}.track{height:9px;background:#222;border:1px solid white;margin-top:5px}.track i{display:block;height:100%;background:var(--green)}.qbox{background:#080b18;border:4px double var(--white);padding:14px;margin-top:12px;text-align:center}.question{font-size:clamp(35px,8vw,57px);margin:12px 0}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.opt{background:var(--navy);border:3px solid white;box-shadow:0 4px #000;padding:18px 5px;font:clamp(20px,5vw,34px) 'VT323',monospace}.opt:hover{background:var(--blue)}.opt:active{transform:translateY(3px)}.msg{color:var(--cyan);min-height:33px;text-align:center;margin:10px 0}.status{display:flex;justify-content:space-between;color:var(--gold);font:11px/1.5 'Press Start 2P',monospace;margin:12px 0;gap:10px}.hidden{display:none!important}.result{text-align:center}.result h2{color:var(--gold);font:22px/1.5 'Press Start 2P',monospace}footer{text-align:center;color:var(--grey);font-size:19px;margin-top:20px}@media(max-width:500px){.hero canvas{width:85px;height:85px}.hero strong{font-size:12px}.panel{padding:10px}.hp{font-size:8px}.tag{font-size:8px}.stages{gap:7px}.stagebtn{padding:8px}.stagebtn strong{font-size:10px}}
</style></head><body><main class="app"><div class="top"><a class="chip" href="../index.html">← LEARNING</a><span class="tag">OLIVER · GRADE 1</span><button class="chip" id="homeBtn">HOME</button></div>
<section id="home"><h1>QUESTION<br>BEASTS</h1><p class="subtitle">Oliver's First Grade Adventure</p><div class="panel hero"><canvas id="portrait" width="64" height="64"></canvas><div><strong>OLIVER'S TEAM</strong><div id="homeStats">Level 1 · 0 Stars</div><div style="color:var(--cyan)">Your beast is ready for battle!</div></div></div><div class="panel"><div class="tag">CHOOSE A STAGE</div><div id="stages" class="stages"></div></div></section>
<section id="play" class="hidden"><div class="status"><span id="stageName"></span><span id="round"></span></div><div class="battle"><canvas id="arena" width="480" height="270"></canvas><div class="hp left">SPARKY<div class="track"><i id="heroHp"></i></div></div><div class="hp right"><span id="enemyName"></span><div class="track"><i id="enemyHp"></i></div></div></div><div class="qbox"><div class="tag" id="skill">MATH ATTACK · CHOOSE THE ANSWER</div><div class="question" id="question"></div><div class="opts" id="opts"></div></div><div class="msg" id="msg" aria-live="polite"></div></section>
<section id="result" class="panel result hidden"><h2 id="resultTitle"></h2><canvas id="victory" width="128" height="96" style="width:256px;max-width:100%;image-rendering:pixelated"></canvas><p id="resultText"></p><button class="action primary" id="again">CONTINUE</button></section><footer>English only · First-grade math · Progress saved on this device</footer></main>
<script>
const $=id=>document.getElementById(id),C=$('arena'),g=C.getContext('2d');g.imageSmoothingEnabled=false;
const colors={'.':null,K:'#1a1c2c',B:'#3b5dc9',C:'#73eff7',W:'#f4f4f4',Y:'#ffcd75',O:'#ef7d57',R:'#b13e53',G:'#38b764',L:'#a7f070',P:'#7048e8'};
const sprites={
hero:['................','.....KKKK.......','....KYYYYK......','...KYYYYYYK.....','..KYYKYYKYYK....','..KYYYYYYYYK....','...KCCCCCCK.....','..KCCWCCWCCK....','..KCCCCCCCCK....','...KCCCCCCK.....','..KBBBBBBBBK....','.KBBKBBBBKBBK...','.KBBKBBBBKBBK...','..KK.BBBB.KK....','.....KBBK.......','....KK..KK......'],
slime:['................','................','......KKKK......','....KKGGGGKK....','...KGGGGGGGGK...','..KGGGGGGGGGGK..','..KGGKGGGGKGGK..','..KGGWGGGGWGGK..','..KGGGGGGGGGGK..','..KGGGGGGGGGGK..','..KGGGKKKKGGGK..','..KGGGGGGGGGGK..','...KGGGGGGGGK...','....KKGGGGKK....','......KKKK......','................'],
bat:['................','................','K..............K','KK...KKKK...KKK','KPK.KPPPPK.KPKK','KPPKPPPPPPKPPPK','KPPPPPPPPPPPPPK','KPPPKWPPWKPPPPK','KPPPPPPPPPPPPPK','KKPPPPKKPPPPPKK','.KKPPPPPPPPKK..','..KKPPPPPPKK...','...KPKPPKPK....','....KK..KK......','................','................'],
rock:['................','.....KKKKKK.....','...KKWWWWWWKK...','..KWWWWWWWWWWK..','.KWWWKKWWWWWWWK.','.KWWWWWWWWWWWWK.','KWWWWWWWWWWWWWWK','KWWWWKKWWKKWWWWK','KWWWWWWWWWWWWWWK','KWWWWWWWWWWWWWWK','.KWWWWWWWWWWWWK.','.KWWKKWWWWKKWWK.','..KWWWWWWWWWWK..','...KKWWWWWWKK...','.....KKKKKK.....','................'],
boss:['....KK....KK....','...KRRK..KRRK...','...KRRRKKRRRK...','..KRRRRRRRRRRK..','.KRRRRRRRRRRRRK.','KRRRRRRRRRRRRRRK','KRRRKWRRRRWKRRRK','KRRRRRRRRRRRRRRK','KRRRRRKKKKRRRRRK','.KRRRRRRRRRRRRK.','..KRRRRRRRRRRK..','..KRRRKRRKRRRK..','...KRRK..KRRK...','..KRRK....KRRK..','..KK........KK..','................']};
function sprite(ctx,key,x,y,scale){sprites[key].forEach((line,yy)=>[...line].forEach((ch,xx)=>{if(colors[ch]){ctx.fillStyle=colors[ch];ctx.fillRect(x+xx*scale,y+yy*scale,scale,scale)}}))}
function portrait(){const p=$('portrait').getContext('2d');p.imageSmoothingEnabled=false;p.fillStyle='#1a1c2c';p.fillRect(0,0,64,64);sprite(p,'hero',8,8,3)}
const stages=[['GREEN MEADOW','slime','addition'],['MOON CAVE','bat','subtraction'],['STONE RIDGE','rock','place value'],['STAR CASTLE','boss','mixed']];
let save;try{save=JSON.parse(localStorage.getItem('oliverQuestionBeasts')||'{}')}catch{save={}}save.cleared=Math.max(0,Math.min(4,save.cleared||0));save.stars=save.stars||0;
function persist(){localStorage.setItem('oliverQuestionBeasts',JSON.stringify(save))}
function home(){ $('play').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');$('homeStats').textContent='Level '+(1+Math.floor(save.stars/12))+' · '+save.stars+' Stars';$('stages').replaceChildren();stages.forEach((st,i)=>{const b=document.createElement('button');b.className='action stagebtn';b.disabled=i>save.cleared;b.innerHTML='<strong>'+(i+1)+'. '+st[0]+'</strong><span>'+(i<save.cleared?'★ Cleared':i===save.cleared?'Ready to battle':'🔒 Locked')+'</span>';b.onclick=()=>start(i);$('stages').append(b)})}
let current=0,turn=0,hp=100,enemyHp=100,answer=0,locked=false;
function start(i){current=i;turn=0;hp=100;enemyHp=100;locked=false;$('home').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.remove('hidden');$('stageName').textContent=stages[i][0];$('enemyName').textContent=['LEAFLING','NIGHT BAT','BOULDER','SHADOW KING'][i];$('msg').textContent='Choose the right answer to attack!';next()}
function rand(n){return Math.floor(Math.random()*n)}
function makeProblem(){let a,b,op,correct,kind=stages[current][2];if(kind==='mixed')kind=['addition','subtraction','place value','counting'][rand(4)];if(kind==='addition'){a=rand(11)+2;b=rand(21-a);correct=a+b;op=a+' + '+b+' = ?'}else if(kind==='subtraction'){a=rand(19)+2;b=rand(a+1);correct=a-b;op=a+' − '+b+' = ?'}else if(kind==='place value'){a=rand(9)+1;b=rand(10);correct=a*10+b;op=a+' tens and '+b+' ones = ?'}else{a=(rand(12)+1)*5;correct=a+5;op='Count by 5s: '+a+', ?'}return{op,correct}}
function next(){locked=false;$('round').textContent='ROUND '+(turn+1)+' / 5';$('heroHp').style.width=hp+'%';$('enemyHp').style.width=enemyHp+'%';const p=makeProblem();answer=p.correct;$('question').textContent=p.op;const nums=[answer];for(let d of [1,2,3,5,10]){if(nums.length>=3)break;let n=answer+(rand(2)?d:-d);if(n>=0&&!nums.includes(n))nums.push(n)}while(nums.length<3)nums.push(answer+nums.length);nums.sort(()=>Math.random()-.5);$('opts').replaceChildren();nums.forEach(n=>{let b=document.createElement('button');b.className='opt';b.textContent=n;b.onclick=()=>choose(n,b);$('opts').append(b)});paint()}
function choose(n,b){if(locked)return;if(n!==answer){hp=Math.max(0,hp-20);b.style.background='#b13e53';$('msg').textContent='Try again! Your beast took damage.';$('heroHp').style.width=hp+'%';if(hp<=0){locked=true;setTimeout(()=>finish(false),650)}return}locked=true;b.style.background='#38b764';turn++;enemyHp=Math.max(0,100-turn*20);$('enemyHp').style.width=enemyHp+'%';$('msg').textContent='SUPER HIT! +1 STAR!';save.stars++;persist();paint();setTimeout(()=>turn>=5?finish(true):next(),700)}
function finish(won){$('play').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=won?'VICTORY!':'TRY AGAIN!';$('resultText').textContent=won?'Amazing work! You defeated '+$('enemyName').textContent+' and earned 5 stars!':'Your beast needs a rest. Try the stage again!';if(won){save.cleared=Math.max(save.cleared,current+1);persist()}let p=$('victory').getContext('2d');p.imageSmoothingEnabled=false;p.fillStyle='#262b44';p.fillRect(0,0,128,96);sprite(p,won?'hero':'slime',32,8,5)}
function paint(){g.fillStyle='#262b44';g.fillRect(0,0,480,270);for(let i=0;i<50;i++){let x=(i*73)%480,y=(i*41)%180;g.fillStyle=i%3?'#333c87':'#3b5dc9';g.fillRect(x,y,3,3)}g.fillStyle='#3b5dc9';g.fillRect(0,178,480,92);g.fillStyle='#1a1c2c';g.fillRect(0,230,480,40);for(let x=0;x<480;x+=32){g.fillStyle=x%64?'#333c87':'#262b44';g.fillRect(x,225,29,4)}g.fillStyle='#1a1c2c';g.fillRect(55,206,130,12);g.fillRect(288,170,138,12);sprite(g,'hero',86,95,6);sprite(g,stages[current][1],314,58,6);g.font='15px monospace';g.fillStyle='#ffcd75';g.fillText('★',210,66)}
$('homeBtn').onclick=home;$('again').onclick=home;portrait();home();
</script></body></html>
